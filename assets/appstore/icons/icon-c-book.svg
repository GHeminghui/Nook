<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C5CAE"/>
      <stop offset="1" stop-color="#232A55"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDE6D8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#0B1024" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="820" cy="240" r="270" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="200" cy="820" r="240" fill="#FFC24B" opacity="0.07"/>

  <!-- 左页 -->
  <g filter="url(#shadow)">
    <path d="M512 322c-52-40-126-58-206-58-26 0-46 20-46 46v402c0 26 20 46 46 46 80 0 154 18 206 58z"
          fill="url(#page)"/>
    <!-- 右页 -->
    <path d="M512 322c52-40 126-58 206-58 26 0 46 20 46 46v402c0 26-20 46-46 46-80 0-154 18-206 58z"
          fill="url(#page)"/>
  </g>

  <!-- 书脊阴影 -->
  <path d="M512 322v494" stroke="#C9C0AE" stroke-width="10" opacity="0.7"/>

  <!-- 文字线 -->
  <g fill="#8B876F" opacity="0.45">
    <rect x="330" y="420" width="132" height="18" rx="9"/>
    <rect x="330" y="470" width="152" height="18" rx="9"/>
    <rect x="330" y="520" width="118" height="18" rx="9"/>
    <rect x="562" y="420" width="132" height="18" rx="9"/>
    <rect x="562" y="470" width="152" height="18" rx="9"/>
    <rect x="562" y="520" width="118" height="18" rx="9"/>
  </g>

  <!-- 铅笔 -->
  <g transform="rotate(38 512 660)">
    <rect x="612" y="330" width="76" height="330" rx="24" fill="#FF6B4A"/>
    <path d="M612 660h76l-38 86z" fill="#FFC24B"/>
    <rect x="612" y="330" width="76" height="58" rx="24" fill="#FFF1EA"/>
  </g>
</svg>
