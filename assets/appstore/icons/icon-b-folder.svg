    <rect x="392" y="410" width="244" height="18" rx="9" fill="#8B876F" opacity="0.4"/>
    <rect x="392" y="456" width="206" height="18" rx="9" fill="#8B876F" opacity="0.4"/>
  </g>

  <!-- 文件夹 -->
  <g filter="url(#shadow)">
    <path d="M206 452c0-36 29-65 65-65h146c18 0 35 7 47 20l34 36h238c36 0 65 29 65 65v330c0 36-29 65-65 65H271c-36 0-65-29-65-65z"
